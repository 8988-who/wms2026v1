server:
  port: 8000
  shutdown: graceful
  address: 0.0.0.0

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.175.131:5432/wms_all_template?currentSchema=public&stringtype=unspecified
    username: postgres
    password: Admin@zw8888!
    max-active: 20
    max-wait: 3000
    test-while-idle: true
    validation-query: SELECT 1
    remove-abandoned: true
    remove-abandoned-timeout: 60

  data:
    redis:
      database: 0
      host: 192.168.175.131
      port: 6379
      password: Admin@zw8888!
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: 2000ms
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
  cache:
    enabled: true
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
    caffeine:
      spec: initialCapacity=50,maximumSize=1000,expireAfterWrite=600s
  # # 邮件配置
  # mail:
  #   host: smtp.wms.com
  #   port: 587
  #   username: 
  #   password: 123456
  #   properties:
  #     smtp:
  #       auth: true
  #       starttls:
  #         enable: true
  #   # 邮件发送者
  #   from: wms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: always
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 数据库类型（PostgreSQL）
      db-type: postgresql
      # 主键ID类型
      id-type: none
      # 逻辑删除对应的全局属性名（注意：须是对象属性名，不能是表字段名，如 isDeleted 而非 is_deleted，否则逻辑删除失效）
      logic-delete-field: isDeleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 接口限流
rate-limit:
  default-limit: 60
  default-window-seconds: 60
  ip:
    enabled: false    # 开发环境关闭 IP 全局限流

# 跨域配置（CORS）
# 安全要求：allowCredentials=true 时禁止使用 "*"，须配置受信任来源白名单
cors:
  allowed-origins:
    - http://localhost:*      # 本地前端开发（任意端口）
    - http://127.0.0.1:*      # 本地前端开发（任意端口）

# 安全配置
security:
  session:
    type: redis-token # 会话方式 [jwt|redis-token]
    access-token-time-to-live: 7200 # 访问令牌 有效期(单位：秒)，默认 2 小时，-1 表示永不过期
    refresh-token-time-to-live: 604800 # 刷新令牌有效期(单位：秒)，默认 7 天，-1 表示永不过期
    jwt:
      # JWT密钥(HS256算法至少32字符)。优先从环境变量 JWT_SECRET 读取；未配置时使用下方开发默认值（仅限本地开发，禁止用于生产）
      secret-key: ${JWT_SECRET:dGhpc19pc19hX2Rldl9vbmx5X2p3dF9zZWNyZXRfMzJfY2hhcnNfbWluaW11bV9rZXk=}
    redis-token:
      allow-multi-login: true # 是否允许多设备登录
  # 安全白名单路径，仅跳过 AuthorizationFilter 过滤器，还是会走 Spring Security 的其他过滤器(CSRF、CORS等)
  ignore-urls:
    - /api/v1/auth/login/** # 登录接口(账号密码登录、手机验证码登录和微信登录)
    - /api/v1/auth/captcha # 验证码获取接口
    # - /api/v1/auth/sms/code # 发送登录短信验证码（接口已下线，接入厂商短信服务后再恢复放行）
    - /api/v1/auth/refresh-token # 刷新令牌接口
    - /api/v1/logs/** # 日志接口(访问日志列表)
    - /api/v1/rcs/reporter/** # RCS 回调入站接口(外部RCS主动回馈,暂不鉴权;生产应改独立token/IP白名单)
  # 非安全端点路径，完全绕过 Spring Security 的过滤器
  unsecured-urls:
    - ${springdoc.swagger-ui.path}
    - /doc.html
    - /swagger-ui/**
    - /v3/api-docs/**
    - /webjars/**
    - /favicon.ico
    - /error
    - /actuator/health/**
    - /actuator/info
    - /actuator/prometheus

# 文件存储配置
oss:
  # OSS 类型 (目前支持aliyun、minio、local)
  type: local
  # MinIO 对象存储服务
  minio:
    # 服务Endpoint
    endpoint: http://localhost:9000
    # 访问凭据
    access-key: minioadmin
    # 凭据密钥
    secret-key: minioadmin
    # 存储桶名称
    bucket-name: public
    # (可选)自定义域名，如果配置了域名，生成的文件URL是域名格式，未配置则URL则是IP格式 (eg: https://www.wms.com/storage)
    custom-domain:
  # 阿里云OSS对象存储服务
  aliyun:
    # 服务Endpoint
    endpoint: oss-cn-hangzhou.aliyuncs.com
    # 访问凭据
    access-key-id: your-access-key-id
    # 凭据密钥
    access-key-secret: your-access-key-secret
    # 存储桶名称
    bucket-name: default
  # 本地存储
  local:
    # 文件存储路径 请注意下，mac用户请使用 /Users/your-username/your-path/，否则会有权限问题，windows用户请使用 D:/your-path/
    storage-path: E:/wms20260712/test/
