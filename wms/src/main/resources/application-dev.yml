# springdoc 配置文档: https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html # Swagger UI 访问路径
    operationsSorter: alpha # 接口按方法名排序
    tags-sorter: alpha # 标签按字母排序
  api-docs:
    path: /v3/api-docs # OpenAPI JSON 地址
  group-configs: # 分组配置
    - group: "系统管理"
      packages-to-scan:
        - com.wms.auth
        - com.wms.system
        - com.wms.file
        - com.wms.message
    - group: "仓库管理"
      packages-to-scan:
        - com.wms.warehouse
    - group: "载具管理系统"
      packages-to-scan:
        - com.wms.carriermanagementsystem
  default-flat-param-object: true

# knife4j 配置
knife4j:
  enable: true
  # 生产环境设置为 true 关闭文档
  production: false
  setting:
    language: zh_cn

# xxl-job 定时任务配置
xxl:
  job:
    # 定时任务开关
    enabled: false
    admin:
      # 多个地址使用,分割
      addresses: http://127.0.0.1:8686/xxl-job-admin
    accessToken: default_token
    executor:
      appname: xxl-job-executor-${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 验证码配置
captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字符配置
  code:
    # 验证码字符类型 math-算术|random-随机字符
    type: math
    # 验证码字符长度，type=算术时，表示运算位数(1:个位数运算 2:十位数运算)；type=随机字符时，表示字符个数
    length: 1
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 24
  # 验证码有效期(秒)
  expire-seconds: 120

# 验证码配置
